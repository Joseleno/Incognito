name: Relatar um problema
description: Algo não funciona como a documentação descreve.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use apenas dados sintéticos. Se o problema depende de um valor específico, descreva o formato dele (por exemplo, "CNPJ alfanumérico com dígito verificador inválido") em vez de colar o valor.

        Se alguma saída da ferramenta mostrou o valor de uma coluna tratada ou a chave, isso é uma falha de segurança: relate em privado, conforme o `SECURITY.md`, e não por aqui.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: o-que-era-esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: Passos, trecho da configuração e esquema mínimo, tudo com dados sintéticos e sem strings de conexão.
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Incognito
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: banco
    attributes:
      label: Banco de dados
      options:
        - PostgreSQL
        - SQL Server
        - Não se aplica
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Versão do banco, sistema operacional e versão do .NET.
      placeholder: PostgreSQL 18, Ubuntu 24.04, .NET 10.0.0
  - type: textarea
    id: saida
    attributes:
      label: Saída da ferramenta
      description: Mensagem de erro ou trecho do relatório. Confira antes de colar que ela não contém dados pessoais.
      render: text
  - type: checkboxes
    id: confirmacao
    attributes:
      label: Confirmação
      options:
        - label: Este relato não contém dados pessoais reais (CPF, CNPJ, nomes, telefones, endereços, chaves de acesso de documentos fiscais), chaves do Incognito nem strings de conexão.
          required: true
