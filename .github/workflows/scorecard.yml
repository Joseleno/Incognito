name: scorecard

# Postura de segurança do repositório pelo OpenSSF Scorecard. O resultado vai para Security > Code scanning e é
# publicado em scorecard.dev, de onde vem o selo do README. Só roda no branch padrão (develop): é o único
# que o Scorecard aceita para publicar.
#
# Com publish_results, o scorecard.dev recusa o resultado se o workflow tiver env ou defaults, permissão de
# escrita no nível do workflow, contêiner, ou passos fora de checkout, upload-artifact, upload-sarif,
# harden-runner e a própria action.

on:
  push:
    branches: [develop]
  schedule:
    - cron: '23 9 * * 1'
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # o Scorecard lê as execuções dos workflows
      security-events: write # envia o resultado para o Code scanning
      id-token: write # prova ao scorecard.dev de onde vem o resultado publicado
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
