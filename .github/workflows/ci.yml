name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Só PR cancela a execução anterior: em push na develop e na main, todo commit fica com resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Exigido pelo Ruleset. Build com avisos como erro, formatação, todos os testes sem banco e cobertura.
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O primeiro pai é a base do PR (no merge ref do PR) ou a develop/main anterior (no push): a guarda dos vetores
          # compara com ele.
          fetch-depth: 2
      # O piso da referência em Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Guarda dos vetores fixos: os vetores do primeiro pai continuam iguais; só entram casos novos. Roda a versão do
      # script que está na base, para uma mudança no script não afrouxar a guarda que julga a própria PR; uma mudança
      # neste workflow ainda pode, e fica com a revisão. Os argumentos abaixo são lidos pelo script da base: mudar a
      # linha de comando dele exige duas PRs (a primeira aceita os dois jeitos).
      - run: |
          git rev-parse --verify --quiet 'HEAD^1^{commit}' > /dev/null || { echo "Sem o primeiro pai para a guarda dos vetores."; exit 1; }
          if git cat-file -e HEAD^1:testes/referencia/conferir_vetores.py 2>/dev/null; then
            git show HEAD^1:testes/referencia/conferir_vetores.py > "$RUNNER_TEMP/guarda.py"
          else
            cp testes/referencia/conferir_vetores.py "$RUNNER_TEMP/guarda.py"
          fi
          python -I "$RUNNER_TEMP/guarda.py" --raiz "$GITHUB_WORKSPACE" --base HEAD^1 --so-crescimento
      # Referência independente: âncoras e vetores fixos conferidos; alterações feitas de propósito são acusadas.
      - run: python -I testes/referencia/conferir_vetores.py --autoteste
      # Só tag de lançamento chega ao envio para o nuget.org no release.yml.
      - run: bash .github/scripts/testar-release.sh
      - run: bash .github/scripts/conferir-actions-fixadas.sh
      # Todo projeto com lock versionado e nada no MSBuild que escape dele; sem isso o --locked-mode abaixo não trava.
      - run: bash .github/scripts/conferir-dependencias.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # Presa aos packages.lock.json: lock file desatualizado quebra aqui.
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test -c Release --no-build --filter-not-trait "Categoria=Integracao" --coverlet --coverlet-output-format cobertura
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: TestResults/*.cobertura.*.xml
          if-no-files-found: error
          retention-days: 7

  # Informativo. O núcleo não depende de banco nem de rede e precisa se comportar igual em todo sistema.
  nucleo-so:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore testes/CodeProcess.Incognito.Testes --locked-mode
      - run: dotnet test --project testes/CodeProcess.Incognito.Testes -c Release --no-restore
