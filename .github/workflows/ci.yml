name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Só PR cancela a execução anterior: em push na develop e na main, todo commit fica com resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Exigido pelo Ruleset. Build com avisos como erro, formatação, os testes sem banco (menos os Lento) e cobertura.
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O primeiro pai é a base do PR (no merge ref do PR) ou a develop/main anterior (no push): a guarda dos vetores
          # compara com ele.
          fetch-depth: 2
      # O piso da referência em Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Guarda dos vetores fixos: os vetores do primeiro pai continuam iguais; só entram casos novos. Roda a versão do
      # script que está na base, para uma mudança no script não afrouxar a guarda que julga a própria PR; uma mudança
      # neste workflow ainda pode, e fica com a revisão. Os argumentos abaixo são lidos pelo script da base: mudar a
      # linha de comando dele exige duas PRs (a primeira aceita os dois jeitos).
      - run: |
          git rev-parse --verify --quiet 'HEAD^1^{commit}' > /dev/null || { echo "Sem o primeiro pai para a guarda dos vetores."; exit 1; }
          if git cat-file -e HEAD^1:testes/referencia/conferir_vetores.py 2>/dev/null; then
            git show HEAD^1:testes/referencia/conferir_vetores.py > "$RUNNER_TEMP/guarda.py"
          else
            cp testes/referencia/conferir_vetores.py "$RUNNER_TEMP/guarda.py"
          fi
          python -I "$RUNNER_TEMP/guarda.py" --raiz "$GITHUB_WORKSPACE" --base HEAD^1 --so-crescimento
      # Referência independente: âncoras e vetores fixos conferidos; alterações feitas de propósito são acusadas.
      - run: python -I testes/referencia/conferir_vetores.py --autoteste
      # Só tag de lançamento chega ao envio para o nuget.org no release.yml.
      - run: bash .github/scripts/testar-release.sh
      - run: bash .github/scripts/conferir-actions-fixadas.sh
      # Todo projeto com lock versionado e nada no MSBuild que escape dele; sem isso o --locked-mode abaixo não trava.
      - run: bash .github/scripts/conferir-dependencias.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # Presa aos packages.lock.json: lock file desatualizado quebra aqui.
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      # A solução dos benchmarks usa os internos do núcleo: compilar e formatar aqui (segundos) impede que uma mudança no
      # núcleo a quebre sem segurar o merge. O job Dry continua no job benchmarks, informativo.
      - run: dotnet restore benchmarks/Incognito.Benchmarks.slnx --locked-mode
      - run: dotnet build benchmarks/Incognito.Benchmarks.slnx -c Release --no-restore
      - run: dotnet format benchmarks/Incognito.Benchmarks.slnx --verify-no-changes --no-restore
      # Sem os testes de banco (Docker) e sem os da categoria Lento, que rodam no job lentos (push) e no release.
      - run: dotnet test -c Release --no-build --filter-not-trait "Categoria=Integracao" --filter-not-trait "Categoria=Lento" --coverlet --coverlet-output-format cobertura
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: TestResults/*.cobertura.*.xml
          if-no-files-found: error
          retention-days: 7

  # Os testes de banco de cada dialeto, com Testcontainers (a fixture sobe o contêiner da versão pedida, com a imagem
  # fixada por digest em testes/<projeto>/imagens/<versão>/Dockerfile). As duas pontas do PostgreSQL suportado em todo PR;
  # as versões do meio também no push na develop e na main. Fixado no ubuntu-24.04, como o release.
  integracao-postgresql:
    name: integracao (postgresql ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(github.event_name == 'push' && '["15","16","17","18"]' || '["15","18"]') }}
    env:
      INCOGNITO_POSTGRES: ${{ matrix.postgres }}
      # Sem o Ryuk do Testcontainers, que é uma imagem sem digest com acesso ao socket do Docker e publica a própria porta
      # em todas as interfaces; o runner é descartado no fim.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: testes/CodeProcess.Incognito.Testes.PostgreSql/packages.lock.json
      - run: dotnet restore testes/CodeProcess.Incognito.Testes.PostgreSql --locked-mode
      # O projeto ignora o código 8 (no job sem banco ele roda zero testes); aqui, zero testes sai com 9.
      - run: dotnet test --project testes/CodeProcess.Incognito.Testes.PostgreSql -c Release --no-restore --filter-trait "Categoria=Integracao" --minimum-expected-tests 1

  # Um nome estável, qualquer que seja a matriz, para o Ruleset exigir quando a integração passar a ser obrigatória:
  # verde só se todas as versões passaram (falha também se a matriz for cancelada ou pulada).
  integracao:
    if: always()
    needs: [integracao-postgresql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULTADO" = success
        env:
          RESULTADO: ${{ needs.integracao-postgresql.result }}

  # Informativo. O núcleo não depende de banco nem de rede e precisa se comportar igual em todo sistema.
  nucleo-so:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore testes/CodeProcess.Incognito.Testes --locked-mode
      - run: dotnet test --project testes/CodeProcess.Incognito.Testes -c Release --no-restore --filter-not-trait "Categoria=Lento"

  # Informativo. Os testes da categoria Lento (estatísticos em domínios maiores), fora do PR para ele seguir rápido: em
  # todo push na develop e na main, para uma regressão aparecer antes do release.
  lentos:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: testes/CodeProcess.Incognito.Testes/packages.lock.json
      - run: dotnet restore testes/CodeProcess.Incognito.Testes --locked-mode
      # Zero testes já é erro no projeto (código 8); o mínimo deixa isso explícito para o filtro de uma categoria só.
      - run: dotnet test --project testes/CodeProcess.Incognito.Testes -c Release --no-restore --filter-trait "Categoria=Lento" --minimum-expected-tests 1

  # Informativo. Os benchmarks ficam numa solução própria (benchmarks/Incognito.Benchmarks.slnx), fora do build do
  # release: aqui só restaura travado, compila, confere a formatação e roda o job Dry do BenchmarkDotNet (uma iteração
  # de cada benchmark, segundos), para o projeto não apodrecer; o programa sai com erro se algum benchmark falhar. O
  # BenchmarkDotNet gera e compila um projeto próprio, cuja restauração não passa pelo --locked-mode (as versões são as
  # do Directory.Packages.props, já na pasta de pacotes). Os números saem do workflow benchmark.yml, manual.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          # Chave de cache própria: com a do rapido, o job mais curto salvaria um cache sem os pacotes dos testes.
          cache-dependency-path: |
            benchmarks/**/packages.lock.json
            src/CodeProcess.Incognito/packages.lock.json
      - run: dotnet restore benchmarks/Incognito.Benchmarks.slnx --locked-mode
      - run: dotnet build benchmarks/Incognito.Benchmarks.slnx -c Release --no-restore
      - run: dotnet format benchmarks/Incognito.Benchmarks.slnx --verify-no-changes --no-restore
      - run: dotnet run -c Release --project benchmarks/CodeProcess.Incognito.Benchmarks --no-build -- --filter "*" --job Dry
