name: codeql

# Análise estática do C# e dos próprios workflows. Sem compilação (build-mode: none): o CodeQL lê o código-fonte
# e os pacotes restaurados. Os alertas aparecem em Security > Code scanning.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analisar:
    name: analisar (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # envia os alertas para o Code scanning
    strategy:
      fail-fast: false
      matrix:
        linguagem: [csharp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # O SDK fixado no global.json, para o extrator usar o mesmo SDK do build. A restauração que o CodeQL faz
      # por conta própria não é presa aos lock files; o que vai para os pacotes passa pelo --locked-mode do CI.
      - if: matrix.linguagem == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          # Dois benchmarks (fora dos pacotes) usam AES em modo ECB só para calcular a função de rodada sobre um bloco, e a
          # consulta de ECB do CodeQL marca qualquer uso do modo. Só esses dois arquivos ficam de fora.
          config: |
            paths-ignore:
              - benchmarks/CodeProcess.Incognito.Benchmarks/RodadaBenchmarks.cs
              - benchmarks/CodeProcess.Incognito.Benchmarks/PrototipoAesBenchmarks.cs
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.linguagem }}
