# Atualizações semanais dos pacotes NuGet, das actions e das imagens dos testes de banco: as de versão
# menor e de correção chegam juntas num único pull request por ecossistema; as de versão maior chegam uma
# a uma (o BenchmarkDotNet, em qualquer tipo de atualização, num pull request próprio; as imagens nunca
# mudam de versão principal). Uma versão nova só é proposta depois de 7 dias publicada. Atualizações de
# segurança não esperam.
#
# O SDK do .NET fica de fora: subir o global.json exige regenerar os lock files
# (dotnet restore --force-evaluate), porque o lock do núcleo guarda o Microsoft.NET.ILLink.Tasks na
# versão do runtime do SDK. É um pull request próprio, feito à mão.
version: 2

updates:
  # A raiz e a solução dos benchmarks (benchmarks/Incognito.Benchmarks.slnx, fora da solução principal): sem a segunda,
  # o BenchmarkDotNet não seria achado nem o lock file dos benchmarks regenerado.
  - package-ecosystem: nuget
    directories: ['/', '/benchmarks']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      # O BenchmarkDotNet ainda está na série 0.x, em que uma versão menor pode quebrar: chega num pull request próprio.
      benchmarks:
        patterns: ['BenchmarkDotNet*']
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
      # As de versão maior, uma por dependência e num só pull request para os dois diretórios (sem isto, o mesmo pacote
      # viria em dois, um por diretório, editando o mesmo Directory.Packages.props).
      nuget-maior:
        patterns: ['*']
        update-types: [major]
        group-by: dependency-name
    # Sem os rótulos padrão em inglês; os do repositório são só em português.
    labels: []

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    labels: []

  # As imagens do PostgreSQL dos testes de banco, uma pasta por versão principal: só a versão menor e o digest mudam (a
  # versão principal de cada pasta é a que ela testa). Todas num pull request só.
  - package-ecosystem: docker
    directories: ['/testes/CodeProcess.Incognito.Testes.PostgreSql/imagens/*']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
    groups:
      imagens:
        patterns: ['*']
    labels: []
